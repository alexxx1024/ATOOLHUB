        tailwind.config = {

                extend: {
                    colors: {

    <!-- JS 逻辑实现 -->
    <script>
        // 内嵌兜底清单（scan_tools.py 自动生成；file:// 打开时生效）
        function getEmbeddedTools() {
            try {
                const el = document.getElementById('__EMBEDDED_TOOLS__');
                if (el && el.textContent.trim()) {
                    const data = JSON.parse(el.textContent);
                    if (Array.isArray(data)) return data;
                }
            } catch (e) { /* ignore */ }
            return [];
        }

        // 本地存储键
        const STORAGE_KEY = 'toolhub_custom_tools';       // 工具列表（含自动发现项 + 手动项，含 hidden/order）
        const STORAGE_AUTOKEY = 'toolhub_auto_tools';     // 最近一次加载的自动发现清单快照（用于校验是否需要刷新）
        const STORAGE_TOMBSTONE = 'toolhub_tombstones';   // 被删除的自动发现工具 id（墓碑，防止重新扫描后复活）

        // 全局状态
        let tools = [];          // 合并后的完整列表（磁盘清单 + 手动添加）
        let autoTools = [];      // 自动发现清单（从 tools.json / 内嵌数据加载）
        let tombstones = {};     // 删除标记 {id: true}
        let activeCategory = '全部';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            loadTools().then(() => {
                renderCategoryTabs();
                renderTools();
            });
        });

        // 加载数据：优先 fetch tools.json，失败回退内嵌清单，再合并 localStorage 个人配置
        async function loadTools() {
            autoTools = getEmbeddedTools();
            const cacheKey = autoTools.map(t => t.id).join(',');
            try {
                const res = await fetch('./tools.json', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length >= 0) {
                        autoTools = data;
                    }
                } else {
                    console.warn('tools.json 返回 ' + res.status + '，使用内嵌清单兜底');
                }
            } catch (e) {
                // file:// 或静态托管下 fetch 失败 → 使用内嵌兜底
                console.warn('tools.json 加载失败，使用内嵌清单:', e);
            }

            const saved = localStorage.getItem(STORAGE_KEY);
            let savedList = [];
            if (saved) {
                try {
                    savedList = JSON.parse(saved);
                } catch (e) { savedList = []; }
            }
            // 清理旧版假数据：早期版本内置的 192.168 假工具（id '1'~'4'）不再需要
            savedList = savedList.filter(t => !(t.url && t.url.includes('192.168')));
            try {
                tombstones = JSON.parse(localStorage.getItem(STORAGE_TOMBSTONE) || '{}');
            } catch (e) { tombstones = {}; }
            // 自动发现清单有更新时，重置本地覆盖，让新工具自然出现
            const lastKey = localStorage.getItem(STORAGE_AUTOKEY);
            if (lastKey !== cacheKey && cacheKey) {
                savedList = [];
                localStorage.setItem(STORAGE_AUTOKEY, cacheKey);
            }
            mergeTools(savedList);
            saveTools();
        }

        // 合并：自动清单为准，叠加 localStorage 中的个人配置（排序、隐藏、覆盖字段、手动添加项）
        function mergeTools(savedList) {
            const savedById = new Map(savedList.map(t => [t.id, t]));
            tools = autoTools
                .filter(auto => !tombstones[auto.id])   // 被删除的自动工具不复活
                .map(auto => {
                    const s = savedById.get(auto.id);
                    if (!s) return { ...auto, hidden: false };
                    return {
                        ...auto,
                        ...s,                      // 个人覆盖字段（name/desc/category/emoji/url/order/hidden）
                        id: auto.id,
                        url: s.url || auto.url     // url 不允许为空
                    };
                });
            // 手动添加（不在磁盘清单中，以 localStorage 为准）
            savedList.forEach(s => {
                if (!tools.find(t => t.id === s.id) && s.url) {
                    tools.push({ ...s, isManual: true });
                }
            });
            // 排序：order 升序，稳定
            tools.sort((a, b) => {
                const oa = (a.order === undefined || a.order === null) ? 999 : a.order;
                const ob = (b.order === undefined || b.order === null) ? 999 : b.order;
                return oa - ob;
            });
        }

        // 保存数据（只存"非默认值"配置，体积小且抗清单变更）
        function saveTools() {
            const data = tools.map(t => {
                const o = { id: t.id, order: t.order };
                if (t.hidden) o.hidden = true;
                if (t.isManual) Object.assign(o, { name: t.name, url: t.url, category: t.category || '', desc: t.desc || '', emoji: t.emoji || '' });
                else {
                    // 仅当与自动清单不同才存覆盖字段
                    const auto = autoTools.find(a => a.id === t.id);
                    if (auto) {
                        if (t.name !== auto.name) o.name = t.name;
                        if (t.url !== auto.url) o.url = t.url;
                        if ((t.category || '') !== (auto.category || '')) o.category = t.category || '';
                        if ((t.desc || '') !== (auto.desc || '')) o.desc = t.desc || '';
                        if ((t.emoji || '') !== (auto.emoji || '')) o.emoji = t.emoji || '';
                    } else {
                        o.name = t.name; o.url = t.url;
                        o.category = t.category || ''; o.desc = t.desc || ''; o.emoji = t.emoji || '';
                    }
                }
                return o;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            localStorage.setItem(STORAGE_TOMBSTONE, JSON.stringify(tombstones));
        }

        // 提取域名 Favicon URL
        function getFaviconUrl(domainUrl) {
            try {
                const url = new URL(domainUrl);
                return `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
            } catch (e) {
                return '';
            }
        }

        // 解析本地图标路径（tools.json 中 icon 为相对工具文件夹的文件名）
        function resolveIconPath(toolUrl, iconName) {
            if (!iconName) return '';
            try {
                const u = new URL(toolUrl, window.location.href);
                const base = u.pathname.substring(0, u.pathname.lastIndexOf('/') + 1);
                const iconUrl = new URL(base + encodeURIComponent(iconName), window.location.href);
                return iconUrl.href;
            } catch (e) {
                return '';
            }
        }

        // 获取域名主字符作为 Fallback 首字母
        function getDomainInitial(domainUrl, name) {
            if (name && name.length > 0) return name.charAt(0).toUpperCase();
            try {
                const url = new URL(domainUrl);
                return url.hostname.replace('www.', '').charAt(0).toUpperCase();
            } catch (e) {
                return 'T';
            }
        }

        // 渲染分类 Tabs
        function renderCategoryTabs() {
            const visibleTools = tools.filter(t => !t.hidden);
            const categories = ['全部', ...new Set(visibleTools.map(t => t.category || '未分类').filter(Boolean))];
            const container = document.getElementById('categoryTabs');
            const datalist = document.getElementById('categoryList');

            datalist.innerHTML = categories.filter(c => c !== '全部').map(c => `<option value="${c}">`).join('');

            container.innerHTML = categories.map(cat => {
                const isActive = cat === activeCategory;
                return `
                    <button onclick="setCategory('${cat}')" 
                        class="px-3.5 py-1.5 rounded-xl transition-all whitespace-nowrap font-medium flex items-center gap-1.5 ${
                            isActive 
                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 border border-indigo-500/50' 
                            : 'bg-slate-900/60 text-slate-400 hover:text-slate-200 border border-slate-800/80 hover:bg-slate-800/60'
                        }">
                        ${cat === '全部' ? '<i class="fa-solid fa-grid-2 text-[10px]"></i>' : ''}
                        <span>${cat}</span>
                    </button>
                `;
            }).join('');
        }

        // 切换分类
        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            renderTools();
        }

        // 渲染主界面卡片
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const empty = document.getElementById('emptyState');

            const filtered = tools.filter(tool => {
                if (tool.hidden) return false; // 隐藏的工具不在集成页展示
                return activeCategory === '全部' || (tool.category || '未分类') === activeCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');

            grid.innerHTML = filtered.map(tool => {
                const favicon = getFaviconUrl(tool.url);
                // 本地图标（扫描脚本发现的 icon 字段）优先于远程 favicon
                const localIcon = tool.icon ? resolveIconPath(tool.url, tool.icon) : '';
                const iconSrc = localIcon || favicon;
                const initial = getDomainInitial(tool.url, tool.name);
                const displayPath = getDisplayPath(tool.url);

                return `
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer" 
                       class="glass-card rounded-2xl p-4 flex flex-col justify-between group relative overflow-hidden">
                        
                        <!-- 悬停渐变装饰背景 -->
                        <div class="absolute -right-10 -top-10 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl group-hover:bg-indigo-500/20 transition-all pointer-events-none"></div>

                        <div>
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <!-- 图标容器：支持自定义Emoji、远程Favicon、首字母Fallback -->
                                <div class="w-10 h-10 rounded-xl bg-slate-900/90 border border-slate-700/50 flex items-center justify-center p-1.5 shadow-inner shrink-0 group-hover:scale-105 group-hover:border-indigo-500/50 transition-all">
                                    ${tool.emoji ? `
                                        <span class="text-lg leading-none">${tool.emoji}</span>
                                    ` : `
                                        <img src="${iconSrc}" alt="${tool.name}" 
                                             class="w-full h-full object-contain"
                                             onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                        <div class="w-full h-full hidden items-center justify-center font-bold text-indigo-400 font-mono text-sm uppercase">
                                            ${initial}
                                        </div>
                                    `}
                                </div>

                                <!-- 类别 Tag -->
                                ${tool.category ? `
                                    <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400 border border-slate-700/40 group-hover:text-indigo-300 group-hover:border-indigo-500/30 transition-colors">
                                        ${tool.category}
                                    </span>
                                ` : ''}
                            </div>

                            <!-- 名称与描述 -->
                            <h3 class="text-sm font-semibold text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-1 flex items-center gap-1">
                                ${tool.name}
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-0 group-hover:opacity-100 transition-opacity ml-1 text-indigo-400"></i>
                            </h3>
                            <p class="text-xs text-slate-400/80 mt-1 line-clamp-2 leading-relaxed">
                                ${tool.desc || '暂无描述信息'}
                            </p>
                        </div>

                        <!-- 底部展示路径（显示斜杠/及之后的内容，跳转保持原完整URL） -->
                        <div class="mt-4 pt-2.5 border-t border-white/5 flex items-center justify-between text-[11px] text-slate-500 font-mono">
                            <span class="truncate max-w-[180px]" title="${tool.url}">${displayPath}</span>
                            <i class="fa-solid fa-chevron-right text-[9px] group-hover:translate-x-1 transition-transform text-indigo-400"></i>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // 获取斜杠之后的内容用于展示
        function getDisplayPath(urlStr) {
            try {
                const parsed = new URL(urlStr);
                const fullSubPath = parsed.pathname + parsed.search + parsed.hash;
                if (!fullSubPath || fullSubPath === '/') {
                    return parsed.hostname;
                }
                return fullSubPath;
            } catch (e) {
                const idx = urlStr.indexOf('/');
                if (idx !== -1) {
                    return urlStr.substring(idx);
                }
                return urlStr;
            }
        }

        // 重置分类
        function resetCategory() {
            activeCategory = '全部';
            renderCategoryTabs();
            renderTools();
        }

        // 事件监听绑定
        function setupEventListeners() {
            const modal = document.getElementById('settingsModal');
            const openBtn = document.getElementById('openSettingsBtn');
            const closeBtn = document.getElementById('closeSettingsBtn');
            const pinModal = document.getElementById('pinModal');

            const openModal = () => {
                renderModalToolsList();
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.children[0].classList.remove('scale-95');
                modal.children[0].classList.add('scale-100');
            };

            const closeModal = () => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.children[0].classList.remove('scale-100');
                modal.children[0].classList.add('scale-95');
                resetForm();
            };

            // 打开设置前先验证密码
            openBtn.addEventListener('click', () => {
                openPinModal();
            });
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 密码弹窗：取消
            document.getElementById('pinCancelBtn').addEventListener('click', () => {
                closePinModal();
            });

            // 密码弹窗：确认（校验 4 位数字）
            document.getElementById('pinConfirmBtn').addEventListener('click', () => {
                const input = document.getElementById('pinInput');
                const val = input.value.trim();
                if (!/^\d{4}$/.test(val)) {
                    input.value = '';
                    input.focus();
                    return;
                }
                const savedPin = localStorage.getItem('atoolhub_pin') || '0000';
                if (val === savedPin) {
                    closePinModal();
                    openModal();
                } else {
                    input.value = '';
                    input.focus();
                }
            });

            // 密码输入框回车确认
            document.getElementById('pinInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('pinConfirmBtn').click();
                }
            });

            // 表单提交（仅编辑现有工具）
            document.getElementById('toolForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('toolId').value;
                if (!id) return; // 没有 id 说明不是编辑模式，忽略

                const name = document.getElementById('toolName').value.trim();
                const category = document.getElementById('toolCategory').value.trim();
                const url = document.getElementById('toolUrl').value.trim();
                const emoji = document.getElementById('toolEmoji').value.trim();
                const desc = document.getElementById('toolDesc').value.trim();

                const index = tools.findIndex(t => t.id === id);
                if (index !== -1) {
                    const old = tools[index];
                    tools[index] = { ...old, name, category, url, emoji, desc };
                    saveTools();
                    renderCategoryTabs();
                    renderTools();
                    renderModalToolsList();
                    resetForm();
                    showToast('工具更新成功');
                }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
        }

        // ================= 设置密码逻辑 =================
        function openPinModal() {
            const pinModal = document.getElementById('pinModal');
            document.getElementById('pinInput').value = '';
            pinModal.classList.remove('opacity-0', 'pointer-events-none');
            pinModal.children[0].classList.remove('scale-95');
            pinModal.children[0].classList.add('scale-100');
            setTimeout(() => document.getElementById('pinInput').focus(), 100);
        }

        function closePinModal() {
            const pinModal = document.getElementById('pinModal');
            pinModal.classList.add('opacity-0', 'pointer-events-none');
            pinModal.children[0].classList.remove('scale-100');
            pinModal.children[0].classList.add('scale-95');
        }

        // 修改密码：需要先验证当前密码，再设置新密码
        function openPinChange() {
            const newPin = prompt('输入新的 4 位数字密码：');
            if (newPin === null) return; // 用户取消
            if (!/^\d{4}$/.test(newPin.trim())) {
                showToast('密码必须为 4 位数字', 'error');
                return;
            }
            localStorage.setItem('atoolhub_pin', newPin.trim());
            showToast('设置密码已更新');
        }

        // 重置表单并隐藏编辑面板
        function resetForm() {
            document.getElementById('toolId').value = '';
            document.getElementById('toolForm').reset();
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square mr-1"></i> 编辑工具';
            document.getElementById('saveBtnText').textContent = '保存修改';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('editPanel').classList.add('hidden');
        }

        // 渲染弹窗中的工具列表
        function renderModalToolsList() {
            const list = document.getElementById('modalToolsList');
            document.getElementById('toolCount').textContent = tools.length;

            if (tools.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">列表为空，快去添加第一个自制工具吧</div>`;
                return;
            }

            list.innerHTML = tools.map((tool, index) => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-950/60 border border-slate-800/80 hover:border-slate-700/60 transition-all text-xs">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="font-mono text-[10px] text-slate-600 w-4 text-center">${index + 1}</span>
                        <div class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center shrink-0 text-sm">
                            ${tool.emoji || '🔗'}
                        </div>
                        <div class="truncate">
                            <div class="text-slate-200 font-medium truncate">${tool.name}</div>
                            <div class="text-[10px] text-slate-500 font-mono truncate">${tool.url}</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="toggleHidden('${tool.id}')" 
                                class="p-1.5 rounded-lg border transition-all ${tool.hidden ? 'bg-slate-800 border-slate-700 text-slate-500 hover:text-slate-300 hover:bg-slate-700' : 'bg-indigo-500/15 border-indigo-500/40 text-indigo-300 hover:bg-indigo-500/25'}"
                                title="${tool.hidden ? '已隐藏：点击后将在集成页展示' : '展示中：点击后将在集成页隐藏'}">
                            ${tool.hidden
                                ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>'
                                : '<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>'}
                        </button>
                        <button onclick="moveTool(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30 p-1.5"' : 'class="p-1.5 text-slate-400 hover:text-indigo-400"'} title="上移">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                        </button>
                        <button onclick="moveTool(${index}, 1)" ${index === tools.length - 1 ? 'disabled class="opacity-30 p-1.5"' : 'class="p-1.5 text-slate-400 hover:text-indigo-400"'} title="下移">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <button onclick="editTool('${tool.id}')" class="p-1.5 text-slate-400 hover:text-amber-400 transition-colors" title="编辑">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="deleteTool('${tool.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors" title="删除">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 排序操作
        function moveTool(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= tools.length) return;
            const temp = tools[index];
            tools[index] = tools[targetIndex];
            tools[targetIndex] = temp;
            saveTools();
            renderTools();
            renderModalToolsList();
        }

        // 显示 / 隐藏切换：隐藏后集成页不再展示入口，但保留在设置列表
        function toggleHidden(id) {
            const tool = tools.find(t => t.id === id);
            if (!tool) return;
            tool.hidden = !tool.hidden;
            saveTools();
            renderCategoryTabs();
            renderTools();
            renderModalToolsList();
            showToast(tool.hidden ? `「${tool.name}」已隐藏` : `「${tool.name}」已展示`);
        }

        // 编辑填充（打开编辑面板）
        function editTool(id) {
            const tool = tools.find(t => t.id === id);
            if (!tool) return;

            document.getElementById('toolId').value = tool.id;
            document.getElementById('toolName').value = tool.name;
            document.getElementById('toolCategory').value = tool.category || '';
            document.getElementById('toolUrl').value = tool.url;
            document.getElementById('toolEmoji').value = tool.emoji || '';
            document.getElementById('toolDesc').value = tool.desc || '';

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square mr-1"></i> 编辑工具信息';
            document.getElementById('saveBtnText').textContent = '保存修改';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('editPanel').classList.remove('hidden');
            // 滚动到编辑面板可见位置
            document.getElementById('editPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 删除工具（自动发现项用墓碑标记防复活；手动项直接移除）
        function deleteTool(id) {
            const tool = tools.find(t => t.id === id);
            if (!tool) return;
            if (!confirm(`确认要删除「${tool.name}」吗？${tool.isManual ? '' : '\n（自动发现的工具将在下次扫描时重新出现，可改用眼睛按钮隐藏）'}`)) return;
            if (tool.isManual) {
                tools = tools.filter(t => t.id !== id);
            } else {
                tool.deleted = true;
                tools = tools.filter(t => t.id !== id);
                tombstones[id] = true;
            }
            saveTools();
            renderCategoryTabs();
            renderTools();
            renderModalToolsList();
            showToast('工具已成功删除');
        }

        // 导出 JSON 配置
        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tools, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `atoolhub_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('配置文件已成功导出');
        }

        // 触发导入
        function triggerImport() {
            document.getElementById('importInput').click();
        }

        // 导入 JSON 配置
        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedTools = JSON.parse(e.target.result);
                    if (Array.isArray(importedTools)) {
                        mergeTools(importedTools);
                        saveTools();
                        renderCategoryTabs();
                        renderTools();
                        renderModalToolsList();
                        showToast('成功导入工具配置');
                    } else {
                        showToast('导入失败：JSON 数据格式不匹配', 'error');
                    }
                } catch (err) {
                    showToast('导入失败：解析 JSON 文件出错', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 清空列表（手动项全部移除；自动项统一隐藏——下次扫描仍会出现，用眼睛按钮可恢复单个）
        function clearAllTools() {
            if (confirm('确定要清空所有工具吗？\n自动发现的工具将被隐藏（下次扫描仍会检测到），手动添加的工具将被删除。')) {
                tombstones = {};
                autoTools.forEach(t => { tombstones[t.id] = true; });
                tools = [];
                saveTools();
                renderCategoryTabs();
                renderTools();
                renderModalToolsList();
                showToast('工具列表已清空');
            }
        }

        // Toast 消息提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            const toastIconWrap = document.getElementById('toastIconWrap');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIconWrap.className = 'text-rose-400';
                toastIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>';
            } else {
                toastIconWrap.className = 'text-indigo-400';
                toastIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-12');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-12');
            }, 3000);
        }
    </script>
</body>
</html>
