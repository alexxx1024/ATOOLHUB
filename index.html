    <style>
        body {

        /* 玻璃拟态与极简霓虹边框 */
        .glass-card {
            background: rgba(18, 23, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.25),
                        0 0 15px 0 rgba(99, 102, 241, 0.1);
            background: rgba(22, 29, 45, 0.85);
        }

        .glass-modal {
            background: rgba(13, 17, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(8, 10, 15, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- 顶部导航栏 (最大宽度与主体对齐 max-w-7xl) -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-dark-bg/75 border-b border-white/5 transition-all">
        <div class="max-w-7xl mx-auto px-4 lg:px-8 py-3.5 flex items-center justify-between gap-4">
            <!-- LOGO与标题 -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-lg">
                    <i class="fa-solid fa-cubes-stacked text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white"><span class="text-indigo-400">A</span>TOOL<span class="text-indigo-400">HUB</span></h1>
                    <p class="text-[10px] text-slate-500 tracking-wider font-mono uppercase">AELIANA.X HANDMADE TOOL NAVIGATION HUB</p>
                </div>
            </div>

            <!-- 右侧操作 -->
            <div class="flex items-center gap-2">
            </div>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8">
        
        <!-- 分类 Filter Tabs -->
        <div id="categoryTabs" class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 text-xs no-scrollbar">
            <!-- 动态通过 JS 渲染类别 -->
        </div>

        <!-- 工具网格布局 -->
        <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">
            <!-- 动态生成卡片 -->
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 rounded-2xl bg-slate-900/80 border border-slate-800 flex items-center justify-center text-slate-600 mb-4 text-2xl">
                <i class="fa-solid fa-compass"></i>
            </div>
            <h3 class="text-sm font-medium text-slate-300 mb-1">未找到相关工具</h3>
            <p class="text-xs text-slate-500 max-w-xs mb-4">尚未添加此类别的自制工具</p>
            <button onclick="resetCategory()" class="px-3.5 py-1.5 text-xs rounded-lg bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600/30 transition-all">
                重置筛选条件
            </button>
        </div>
    </main>

    <!-- 内嵌工具清单兜底数据（由 scan_tools.py 自动更新；优先加载同目录 tools.json） -->
    <script id="__EMBEDDED_TOOLS__" type="application/json">

    "desc": "DOCX 转 EPUB 在线转换工具",

    <!-- JS 逻辑实现 -->
    <script>
        // 内嵌兜底清单（scan_tools.py 自动生成；file:// 打开时生效）
        function getEmbeddedTools() {
            try {
                const el = document.getElementById('__EMBEDDED_TOOLS__');
                if (el && el.textContent.trim()) {
                    const data = JSON.parse(el.textContent);
                    if (Array.isArray(data)) return data;
                }
            } catch (e) { /* ignore */ }
            return [];
        }

        // 本地存储键
        const STORAGE_KEY = 'toolhub_custom_tools';       // 工具列表（含自动发现项 + 手动项，含 hidden/order）
        const STORAGE_AUTOKEY = 'toolhub_auto_tools';     // 最近一次加载的自动发现清单快照（用于校验是否需要刷新）

        // 全局状态
        let tools = [];          // 合并后的完整列表（磁盘清单 + 手动添加）
        let autoTools = [];      // 自动发现清单（从 tools.json / 内嵌数据加载）
        let activeCategory = '全部';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadTools().then(() => {
                renderCategoryTabs();
                renderTools();
            });
        });

        // 加载数据：优先 fetch tools.json，失败回退内嵌清单，再合并 localStorage 个人配置
        async function loadTools() {
            autoTools = getEmbeddedTools();
            const cacheKey = autoTools.map(t => t.id).join(',');
            try {
                const res = await fetch('./tools.json', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length >= 0) {
                        autoTools = data;
                    }
                } else {
                    console.warn('tools.json 返回 ' + res.status + '，使用内嵌清单兜底');
                }
            } catch (e) {
                // file:// 或静态托管下 fetch 失败 → 使用内嵌兜底
                console.warn('tools.json 加载失败，使用内嵌清单:', e);
            }

            const saved = localStorage.getItem(STORAGE_KEY);
            let savedList = [];
            if (saved) {
                try {
                    savedList = JSON.parse(saved);
                } catch (e) { savedList = []; }
            }
            // 清理旧版假数据：早期版本内置的 192.168 假工具（id '1'~'4'）不再需要
            savedList = savedList.filter(t => !(t.url && t.url.includes('192.168')));
            // 自动发现清单有更新时，重置本地覆盖，让新工具自然出现
            const lastKey = localStorage.getItem(STORAGE_AUTOKEY);
            if (lastKey !== cacheKey && cacheKey) {
                savedList = [];
                localStorage.setItem(STORAGE_AUTOKEY, cacheKey);
            }
            mergeTools(savedList);
            saveTools();
        }

        // 合并：自动清单为准，叠加 localStorage 中的个人配置（排序、隐藏、覆盖字段、手动添加项）
        function mergeTools(savedList) {
            const savedById = new Map(savedList.map(t => [t.id, t]));
            tools = autoTools
                .map(auto => {
                    const s = savedById.get(auto.id);
                    if (!s) return { ...auto, hidden: false };
                    return {
                        ...auto,
                        ...s,                      // 个人覆盖字段（name/desc/category/emoji/url/order/hidden）
                        id: auto.id,
                        url: s.url || auto.url     // url 不允许为空
                    };
                });
            // 手动添加（不在磁盘清单中，以 localStorage 为准）
            savedList.forEach(s => {
                if (!tools.find(t => t.id === s.id) && s.url) {
                    tools.push({ ...s, isManual: true });
                }
            });
            // 排序：order 升序，稳定
            tools.sort((a, b) => {
                const oa = (a.order === undefined || a.order === null) ? 999 : a.order;
                const ob = (b.order === undefined || b.order === null) ? 999 : b.order;
                return oa - ob;
            });
        }

        // 保存数据（只存"非默认值"配置，体积小且抗清单变更）
        function saveTools() {
            const data = tools.map(t => {
                const o = { id: t.id, order: t.order };
                if (t.hidden) o.hidden = true;
                if (t.isManual) Object.assign(o, { name: t.name, url: t.url, category: t.category || '', desc: t.desc || '', emoji: t.emoji || '' });
                else {
                    // 仅当与自动清单不同才存覆盖字段
                    const auto = autoTools.find(a => a.id === t.id);
                    if (auto) {
                        if (t.name !== auto.name) o.name = t.name;
                        if (t.url !== auto.url) o.url = t.url;
                        if ((t.category || '') !== (auto.category || '')) o.category = t.category || '';
                        if ((t.desc || '') !== (auto.desc || '')) o.desc = t.desc || '';
                        if ((t.emoji || '') !== (auto.emoji || '')) o.emoji = t.emoji || '';
                    } else {
                        o.name = t.name; o.url = t.url;
                        o.category = t.category || ''; o.desc = t.desc || ''; o.emoji = t.emoji || '';
                    }
                }
                return o;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // 提取域名 Favicon URL
        function getFaviconUrl(domainUrl) {
            try {
                const url = new URL(domainUrl);
                return `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
            } catch (e) {
                return '';
            }
        }

        // 解析本地图标路径（tools.json 中 icon 为相对工具文件夹的文件名）
        function resolveIconPath(toolUrl, iconName) {
            if (!iconName) return '';
            try {
                const u = new URL(toolUrl, window.location.href);
                const base = u.pathname.substring(0, u.pathname.lastIndexOf('/') + 1);
                const iconUrl = new URL(base + encodeURIComponent(iconName), window.location.href);
                return iconUrl.href;
            } catch (e) {
                return '';
            }
        }

        // 获取域名主字符作为 Fallback 首字母
        function getDomainInitial(domainUrl, name) {
            if (name && name.length > 0) return name.charAt(0).toUpperCase();
            try {
                const url = new URL(domainUrl);
                return url.hostname.replace('www.', '').charAt(0).toUpperCase();
            } catch (e) {
                return 'T';
            }
        }

        // 渲染分类 Tabs
        function renderCategoryTabs() {
            const visibleTools = tools.filter(t => !t.hidden);
            const categories = ['全部', ...new Set(visibleTools.map(t => t.category || '未分类').filter(Boolean))];
            const container = document.getElementById('categoryTabs');

            container.innerHTML = categories.map(cat => {
                const isActive = cat === activeCategory;
                return `
                    <button onclick="setCategory('${cat}')" 
                        class="px-3.5 py-1.5 rounded-xl transition-all whitespace-nowrap font-medium flex items-center gap-1.5 ${
                            isActive 
                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 border border-indigo-500/50' 
                            : 'bg-slate-900/60 text-slate-400 hover:text-slate-200 border border-slate-800/80 hover:bg-slate-800/60'
                        }">
                        ${cat === '全部' ? '<i class="fa-solid fa-grid-2 text-[10px]"></i>' : ''}
                        <span>${cat}</span>
                    </button>
                `;
            }).join('');
        }

        // 切换分类
        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            renderTools();
        }

        // 渲染主界面卡片
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const empty = document.getElementById('emptyState');

            const filtered = tools.filter(tool => {
                if (tool.hidden) return false; // 隐藏的工具不在集成页展示
                return activeCategory === '全部' || (tool.category || '未分类') === activeCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');

            grid.innerHTML = filtered.map(tool => {
                const favicon = getFaviconUrl(tool.url);
                // 本地图标（扫描脚本发现的 icon 字段）优先于远程 favicon
                const localIcon = tool.icon ? resolveIconPath(tool.url, tool.icon) : '';
                const iconSrc = localIcon || favicon;
                const initial = getDomainInitial(tool.url, tool.name);
                const displayPath = getDisplayPath(tool.url);

                return `
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer" 
                       class="glass-card rounded-2xl p-4 flex flex-col justify-between group relative overflow-hidden">
                        
                        <!-- 悬停渐变装饰背景 -->
                        <div class="absolute -right-10 -top-10 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl group-hover:bg-indigo-500/20 transition-all pointer-events-none"></div>

                        <div>
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <!-- 图标容器：支持自定义Emoji、远程Favicon、首字母Fallback -->
                                <div class="w-10 h-10 rounded-xl bg-slate-900/90 border border-slate-700/50 flex items-center justify-center p-1.5 shadow-inner shrink-0 group-hover:scale-105 group-hover:border-indigo-500/50 transition-all">
                                    ${tool.emoji ? `
                                        <span class="text-lg leading-none">${tool.emoji}</span>
                                    ` : `
                                        <img src="${iconSrc}" alt="${tool.name}" 
                                             class="w-full h-full object-contain"
                                             onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                        <div class="w-full h-full hidden items-center justify-center font-bold text-indigo-400 font-mono text-sm uppercase">
                                            ${initial}
                                        </div>
                                    `}
                                </div>

                                <!-- 类别 Tag -->
                                ${tool.category ? `
                                    <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400 border border-slate-700/40 group-hover:text-indigo-300 group-hover:border-indigo-500/30 transition-colors">
                                        ${tool.category}
                                    </span>
                                ` : ''}
                            </div>

                            <!-- 名称与描述 -->
                            <h3 class="text-sm font-semibold text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-1 flex items-center gap-1">
                                ${tool.name}
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-0 group-hover:opacity-100 transition-opacity ml-1 text-indigo-400"></i>
                            </h3>
                            <p class="text-xs text-slate-400/80 mt-1 line-clamp-2 leading-relaxed">
                                ${tool.desc || '暂无描述信息'}
                            </p>
                        </div>

                        <!-- 底部展示路径（显示斜杠/及之后的内容，跳转保持原完整URL） -->
                        <div class="mt-4 pt-2.5 border-t border-white/5 flex items-center justify-between text-[11px] text-slate-500 font-mono">
                            <span class="truncate max-w-[180px]" title="${tool.url}">${displayPath}</span>
                            <i class="fa-solid fa-chevron-right text-[9px] group-hover:translate-x-1 transition-transform text-indigo-400"></i>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // 获取斜杠之后的内容用于展示
        function getDisplayPath(urlStr) {
            try {
                const parsed = new URL(urlStr);
                const fullSubPath = parsed.pathname + parsed.search + parsed.hash;
                if (!fullSubPath || fullSubPath === '/') {
                    return parsed.hostname;
                }
                return fullSubPath;
            } catch (e) {
                const idx = urlStr.indexOf('/');
                if (idx !== -1) {
                    return urlStr.substring(idx);
                }
                return urlStr;
            }
        }

        // 重置分类
        function resetCategory() {
            activeCategory = '全部';
            renderCategoryTabs();
            renderTools();
        }

        // 事件监听绑定


        // 排序操作

        // 显示 / 隐藏切换：隐藏后集成页不再展示入口，但保留在设置列表

        // 编辑填充（打开编辑面板）

        // 删除工具（自动发现项用墓碑标记防复活；手动项直接移除）

        // 导出 JSON 配置

        // 触发导入

        // 导入 JSON 配置

        // 清空列表（手动项全部移除；自动项统一隐藏——下次扫描仍会出现，用眼睛按钮可恢复单个）

        // Toast 消息提示
    </script>
